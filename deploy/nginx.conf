# 연금 Agent 평가 API — nginx 리버스 프록시 설정
#
# 설치 위치 (예: Ubuntu/Debian 기준):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pension-agent
#   sudo ln -s /etc/nginx/sites-available/pension-agent /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # 기본 사이트와 80번 충돌 방지
#   sudo nginx -t && sudo systemctl reload nginx
#
# 주최측 평가 API 규격(API.md 참고) 핵심 준수 사항:
#   - 포트 80(HTTP) 또는 443(HTTPS)만 허용. 8000번은 제출 불가 → uvicorn은
#     127.0.0.1:8000에서만 듣고, 외부에는 이 nginx가 80/443으로 노출한다.
#   - proxy_read_timeout을 기본값(60초)보다 반드시 길게. 에이전트 데드라인이
#     240초 + 여유 60초 = 300초 타임아웃 규격이므로, nginx가 그보다 먼저
#     끊어버리면 정상 응답도 502/504로 날아간다.

server {
    listen 80 default_server;
    # IPv6 listen은 넣지 않는다. NCP VM은 IPv6이 비활성이라
    # listen [::]:80 이 있으면 nginx -t 자체가 socket() 97 에러로 죽는다
    # (2026-09-01 배포 중 실측). 주최측 접근은 IPv4 공인 IP뿐이다.
    server_name _;

    # 평가 API가 실제로 부르는 경로. 규격에 인증 헤더가 없으므로 nginx 단에서도
    # 별도 인증을 걸지 않는다.
    location /answer {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_connect_timeout 320s;
        proxy_send_timeout    320s;
        proxy_read_timeout    320s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 배포 후 우리가 생존 확인용으로만 쓰는 엔드포인트. 평가 규격에는 없다.
    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
}

# HTTPS(443)로 제출하려면 인증서 발급 후(예: certbot) 아래처럼 server 블록을
# 추가하고 위 80번 블록은 443으로 리다이렉트하도록 바꾼다. 지금은 HTTP만 구성.
